# Trust boundary: public traffic reaches this container only through cloudflared.
# The host publish is loopback-only, and only the app/api/edge/connector join the
# dedicated Docker network. Cloudflare overwrites CF-Connecting-IP at the edge.
map $http_cf_connecting_ip $stock_client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

limit_req_zone $binary_remote_addr zone=stock_connector:10m rate=6000r/m;
limit_req_zone $stock_client_ip zone=stock_client:10m rate=300r/m;
# The brain is machine-to-machine (service-token holders only), so it gets its
# own budget: a burst of BFF calls must never consume the browser allowance.
limit_req_zone $binary_remote_addr zone=brain_connector:10m rate=12000r/m;

server {
  listen 80;
  server_name stock.jigooo.com localhost;

  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  include /etc/nginx/snippets/stock-security-headers.conf;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $stock_insight_upstream stock-insight-app:3000;

  location = /__edge_health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Content-hashed immutable bundles. Nitro already answers these with
  # `public, max-age=31536000, immutable`; the blanket `proxy_hide_header
  # Cache-Control` in `location /` was throwing that away, so every visit
  # re-fetched the whole bundle through the tunnel. This block exists only to
  # stop discarding a correct header — it does not invent a new policy.
  #
  # Cache-Control is deliberately neither hidden nor re-added here: adding one
  # on top of the origin's would emit two conflicting values. Only the CDN-
  # specific headers are set, because `location /` marks those `no-store` and
  # Cloudflare would otherwise refuse to cache.
  #
  # `add_header` does not merge across levels, so declaring any header here
  # drops the server-level security snippet — it must be re-included, exactly
  # as `location /` and `location /v1/` already do.
  location ^~ /assets/ {
    limit_req zone=stock_connector burst=1000 nodelay;
    limit_req zone=stock_client burst=100 nodelay;
    limit_req_status 429;

    include /etc/nginx/snippets/stock-security-headers.conf;
    add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable" always;

    proxy_pass http://$stock_insight_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $stock_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Stock-Client-IP $stock_client_ip;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 1m;
  }

  location / {
    limit_req zone=stock_connector burst=1000 nodelay;
    limit_req zone=stock_client burst=100 nodelay;
    limit_req_status 429;

    include /etc/nginx/snippets/stock-security-headers.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, no-transform" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;

    proxy_pass http://$stock_insight_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $stock_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Stock-Client-IP $stock_client_ip;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 1m;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}

# Brain gateway. Reachable only via insight-api.jigooo.com, which sits behind a
# Cloudflare Access application with a Service Auth policy — a request that
# reaches this block has already presented a valid service token. Even so the
# surface is deliberately narrow: only /v1/ is routed, and the api-server's own
# unauthenticated liveness endpoints are NOT exposed here (their healthchecks run
# container-local against 127.0.0.1:6200).
server {
  listen 80;
  server_name insight-api.jigooo.com;

  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  include /etc/nginx/snippets/stock-security-headers.conf;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $stock_insight_brain stock-insight-api:6200;

  location = /__edge_health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Everything outside /v1/ is refused before it can reach the brain. This keeps
  # /health and /v1/meta — the two paths the api-server lets through without an
  # internal context — off the public hostname entirely.
  location / {
    return 404;
  }

  location /v1/ {
    limit_req zone=brain_connector burst=2000 nodelay;
    limit_req_status 429;

    include /etc/nginx/snippets/stock-security-headers.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, no-transform" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;

    proxy_pass http://$stock_insight_brain;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $stock_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Strip inbound credentials that are meant for the edge, not the brain: the
    # Access service-token pair terminates here, and Authorization is unused.
    proxy_set_header Authorization "";
    proxy_set_header CF-Access-Client-Id "";
    proxy_set_header CF-Access-Client-Secret "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 1m;
  }

  gzip on;
  gzip_types application/json;
}
