[global]
repo1-path=/home/postgres/pgbackrest/repo
repo1-retention-full=2
repo1-retention-diff=6
repo1-retention-archive-type=full
repo1-bundle=y
repo1-block=y
compress-type=zst
process-max=2
start-fast=y
log-level-console=info
spool-path=/home/postgres/pgbackrest/spool

[research-app]
pg1-path=/home/postgres/pgdata/data
pg1-port=5432
pg1-user=research_app
