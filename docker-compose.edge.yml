name: stock-insight-edge

services:
  edge:
    image: ${STOCK_INSIGHT_EDGE_IMAGE:-sha256:5d537d7ac6dd92781d96425915bf219e110c26e8f5570ffd9b1b348391bb4082}
    ports:
      - '127.0.0.1:${STOCK_INSIGHT_EDGE_PORT:-8092}:80'
    networks:
      stock-edge:
        aliases:
          - stock-insight-edge
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/__edge_health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

networks:
  stock-edge:
    external: true
    name: stock-insight-edge
